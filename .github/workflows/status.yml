name: Monitor de servicios

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: status-monitor
  cancel-in-progress: true

jobs:
  revisar-y-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Recuperar historial anterior
        run: |
          mkdir -p public/data
          curl -fsSL "${{ steps.pages.outputs.base_url }}/data/status.json" -o public/data/status.json || echo "Sin historial previo, se empieza de cero."

      - run: npm ci

      - name: Revisar servicios
        run: npm run check

      - name: Compilar la app
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
